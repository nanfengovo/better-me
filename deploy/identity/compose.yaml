# Separate operator-owned identity installation; never use this to replace an existing issuer/DB.
services:
  casdoor:
    image: casbin/casdoor:v4.25.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASDOOR_PORT:-18000}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - type: bind
        source: "${CASDOOR_PRIVATE_DIR:?Provide a NEW protected identity configuration}/conf/app.conf"
        target: /conf/app.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${CASDOOR_PRIVATE_DIR:?Provide a NEW protected identity configuration}/init_data.json"
        target: /init_data.json
        read_only: true
        bind:
          create_host_path: false
      # The upstream image initializes /logs for UID 1000. Keep DB, WAL and logs persistent.
      - casdoor-data:/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/.well-known/openid-configuration"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  casdoor-data:
