services:
  web:
    image: better-me:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BETTER_ME_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    # Resume data stays in each visitor's browser; no server-side volume is needed.
