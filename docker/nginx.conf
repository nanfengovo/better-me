worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/better-me.mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Vite's content-hashed assets are immutable. HTML and legal text stay fresh.
    map "$status:$uri" $cache_policy {
        default "no-store";
        "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9.]+$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control $cache_policy always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","mode":"static"}\n';
        }

        # The Vite development plugins are intentionally absent from this static image.
        location ~ ^/api(?:/|$) {
            default_type application/json;
            return 501 '{"error":"local_service_required","message":"This static deployment does not provide local browser or job APIs."}\n';
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ^~ /legal/ {
            autoindex off;
            try_files $uri $uri/ =404;
        }

        location ~ (^|/)\. {
            return 404;
        }

        # Missing files must not masquerade as an HTML success, especially JS/PDF workers.
        location ~* \.(?:html|css|js|mjs|map|json|geojson|txt|md|xml|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|otf|wasm|pdf|py)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
